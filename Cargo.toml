[workspace]
resolver = "3"
members = [
    "crates/protocol/candyriya-protocol",
    "crates/protocol/candyriya-protocol-registry",
    "crates/protocol/candyriya-compression",
    "crates/protocol/candyriya-encryption",
    "crates/plugin/candyriya-plugin",
    "crates/plugin/candyriya-plugin-api",
    "crates/permissions/candyriya-permissions",
    "crates/permissions/candyriya-permissions-config",
    "crates/player/candyriya-player",
    "crates/player/candyriya-player-store",
    "crates/auth/candyriya-auth",
    "crates/config/candyriya-config",
    "crates/common/candyriya-utils",
    "crates/common/candyriya-i18n",
    "crates/common/candyriya-metrics",
    "crates/common/candyriya-telemetry",
    "crates/common/candyriya-eventbus",
    "crates/common/candyriya-scheduler",
    "crates/common/candyriya-cache",
    "crates/messaging/candyriya-messaging",
    "crates/messaging/candyriya-messaging-bungeecord",
    "crates/messaging/candyriya-messaging-velocity",
    "crates/messaging/candyriya-messaging-candyriya",
    "crates/network/candyriya-forwarding",
    "crates/network/candyriya-route",
    "crates/network/candyriya-ratelimit",
    "crates/proxy/candyriya-proxy",
    "crates/commands/candyriya-command",
    "crates/bench/candyriya-bench",
    "crates/bench/fuzz",
    "crates/it/candyriya-it",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/bejiihiu/candyriya-rs"
homepage = "https://bejiihiu.github.io/candyriya-rs"
documentation = "https://bejiihiu.github.io/candyriya-rs"
authors = ["bejiihiu"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"
socket2 = "0.6"
parking_lot = "0.12"
arc-swap = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "time"] }
tracing-opentelemetry = "0.34"
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "grpc-tonic"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
figment = { version = "0.10", features = ["toml"] }
toml = "1"
uuid = { version = "1", features = ["v4", "v3", "serde"] }
hmac = "0.12"
sha1 = "0.10"
reqwest = { version = "0.12" }
sha2 = "0.10"
md5 = "0.8"
# pure safe-Rust backend only (miniz_oxide); never libz/zlib/zlib-sys
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
indexmap = "2"
lobsterchat = { version = "0.4", features = ["minimessage"] }
azalea-brigadier = "0.16"
# no http/url-fetch and no filesystem registration: plugins are compiled
# from bytes the loader reads itself; keeps the audit surface small
extism = { version = "1", default-features = false, features = ["wasmtime-default-features"] }
cachegirl = { version = "1", features = ["memory", "cache", "async", "tokio", "tracing"] }
tokio-cron-scheduler = "0.15"
anyhow = "1"
zeroize = "1"
aes = "0.9"
cfb8 = "0.9"
# 0.10 fixes RUSTSEC-2023-0071 (Marvin Attack). pkcs1v15 is required by the
# Minecraft handshake, which encrypts the shared secret with PKCS#1 v1.5.
# default-features off: no getrandom 0.4 on this stack - every RNG use is
# passed explicitly by callers (see candyriya-encryption).
rsa = { version = "0.10", default-features = false, features = ["std", "encoding", "pkcs1v15"] }
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
tracing-appender = "0.2"
semver = "1"
criterion = "0.7"
rayon = "1.12"
num_cpus = "1"
base64 = "0.22"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "deny"
perf = "warn"
style = "warn"
