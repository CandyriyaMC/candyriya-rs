# Minecraft server properties — smoke backend template.
#
# The smoke backend runs with velocity modern forwarding in front of it, so
# it must not try to authenticate players against Mojang on its own.
# Everything not listed here is regenerated by Paper with its defaults.

# The proxy owns online-mode; the backend always trusts the forwarded profile.
online-mode=false

server-port=25565

# keep the smoke world small and cheap to generate
view-distance=4
simulation-distance=4
enable-query=false
enable-rcon=false
