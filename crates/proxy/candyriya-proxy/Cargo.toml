[package]
name = "candyriya-proxy"
description = "Proxy core: accept loop, handshake and login pipelines, packet middleware and bidirectional forwarding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Deps stay minimal on purpose: this crate is built in slices (accept loop
# first, handshake/login behind it). Each slice adds what it uses; the
# composition root wires the rest. Heavy feature chains (plugin host,
# encryption) are deliberately NOT declared until the code that needs them
# lands.
[dependencies]
tokio = { workspace = true }
socket2 = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
candyriya-config = { version = "0.1.0", path = "../../config/candyriya-config" }
candyriya-ratelimit = { version = "0.1.0", path = "../../network/candyriya-ratelimit" }
candyriya-scheduler = { version = "0.1.0", path = "../../common/candyriya-scheduler" }

[lints]
workspace = true
