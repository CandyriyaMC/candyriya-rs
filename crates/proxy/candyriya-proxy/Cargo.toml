[package]
name = "candyriya-proxy"
description = "Proxy core: accept loop, handshake and login pipelines, packet middleware and bidirectional forwarding."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["minecraft", "proxy", "papermc", "velocity", "forwarding"]
categories = ["network-programming", "games", "game-development"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

# Deps stay minimal on purpose: this crate is built in slices (accept loop
# first, handshake/login behind it). Each slice adds what it uses; the
# composition root wires the rest.
[dependencies]
tokio = { workspace = true }
socket2 = { workspace = true }
bytes = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
candyriya-config = { version = "0.1.0", path = "../../config/candyriya-config" }
candyriya-protocol = { version = "0.1.0", path = "../../protocol/candyriya-protocol" }
candyriya-protocol-registry = { version = "0.1.0", path = "../../protocol/candyriya-protocol-registry" }
candyriya-compression = { version = "0.1.0", path = "../../protocol/candyriya-compression" }
candyriya-encryption = { version = "0.1.0", path = "../../protocol/candyriya-encryption" }
candyriya-auth = { version = "0.1.0", path = "../../auth/candyriya-auth" }
candyriya-player = { version = "0.1.0", path = "../../player/candyriya-player" }
candyriya-forwarding = { version = "0.1.0", path = "../../network/candyriya-forwarding" }
candyriya-route = { version = "0.1.0", path = "../../network/candyriya-route" }
candyriya-ratelimit = { version = "0.1.0", path = "../../network/candyriya-ratelimit" }
candyriya-scheduler = { version = "0.1.0", path = "../../common/candyriya-scheduler" }
candyriya-cache = { version = "0.1.0", path = "../../common/candyriya-cache" }
candyriya-init = { version = "0.1.0", path = "../../common/candyriya-init" }
candyriya-i18n = { version = "0.1.0", path = "../../common/candyriya-i18n" }
# the strict MiniMessage acceptance gate already used for config strings
candyriya-plugin-api = { version = "0.1.0", path = "../../plugin/candyriya-plugin-api" }

[dev-dependencies]
candyriya-it = { version = "0.1.0", path = "../../it/candyriya-it" }
# the event-dispatch wiring test runs real plugins through the real
# dispatcher, not a fake; the same WAT-fixture pattern the plugin crate uses
candyriya-plugin = { path = "../../plugin/candyriya-plugin" }
wat = "1"
# the online-mode test plays the client side of the Mojang encryption handshake
rsa = { workspace = true }
uuid = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
