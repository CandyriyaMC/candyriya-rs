[package]
name = "candyriya-bench"
description = "Criterion benchmarks for hot protocol paths."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["benchmarking", "criterion", "minecraft", "proxy", "protocol"]
categories = ["development-tools", "games"]
# dev-only harness; not meant for crates.io
publish = false

[dev-dependencies]
candyriya-protocol = { version = "0.1.0", path = "../../protocol/candyriya-protocol" }
candyriya-compression = { version = "0.1.0", path = "../../protocol/candyriya-compression" }
candyriya-protocol-registry = { version = "0.1.0", path = "../../protocol/candyriya-protocol-registry" }
candyriya-cache = { version = "0.1.0", path = "../../common/candyriya-cache" }
candyriya-forwarding = { version = "0.1.0", path = "../../network/candyriya-forwarding" }
candyriya-player = { version = "0.1.0", path = "../../player/candyriya-player" }
bytes = { workspace = true }
uuid = { workspace = true }
criterion = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "codec"
harness = false

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "cache"
harness = false

[[bench]]
name = "forwarding"
harness = false
