[package]
name = "candyriya-command"
description = "Brigadier command wiring and built-in commands (/candyriya, /server, /glist, /goto and friends)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["brigadier", "commands", "minecraft", "proxy", "papermc"]
categories = ["command-line-interface", "games", "game-development"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
# the brigadier port this crate wires up; never re-exported wholesale
azalea-brigadier = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
candyriya-permissions = { version = "0.1.0", path = "../../permissions/candyriya-permissions" }
candyriya-i18n = { version = "0.1.0", path = "../../common/candyriya-i18n" }
candyriya-utils = { version = "0.1.0", path = "../../common/candyriya-utils" }

[lints]
workspace = true
