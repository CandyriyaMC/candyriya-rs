[package]
name = "candyriya-player"
description = "Player and OfflinePlayer models: game profile, properties and offline UUID derivation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["minecraft", "proxy", "player", "papermc", "velocity"]
categories = ["games", "game-development"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
uuid = { workspace = true }
serde = { workspace = true, features = ["derive"] }
chrono = { workspace = true }
thiserror = { workspace = true }
# pure Rust, no C dependencies; used for the offline-mode UUID derivation
md5 = { workspace = true }
candyriya-protocol-registry = { version = "0.1.0", path = "../../protocol/candyriya-protocol-registry" }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
