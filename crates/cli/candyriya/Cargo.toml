[package]
name = "candyriya"
description = "Command-line entry point and composition root for the candyriya proxy."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "candyriya"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
candyriya-proxy = { version = "0.1.0", path = "../../proxy/candyriya-proxy" }
candyriya-config = { version = "0.1.0", path = "../../config/candyriya-config" }
candyriya-metrics = { version = "0.1.0", path = "../../common/candyriya-metrics" }
candyriya-telemetry = { version = "0.1.0", path = "../../common/candyriya-telemetry" }
candyriya-scheduler = { version = "0.1.0", path = "../../common/candyriya-scheduler" }
candyriya-command = { version = "0.1.0", path = "../../commands/candyriya-command" }

[lints]
workspace = true
