[package]
name = "candyriya-auth"
description = "Offline and online (Mojang session) authentication for the proxy: RSA encryption handshake, AES-CFB8 cipher management and the server-side session join check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
reqwest = { workspace = true, default-features = false, features = ["default-tls", "json", "charset", "http2"] }
rsa = { workspace = true }
aes = { workspace = true }
cfb8 = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
md5 = { workspace = true }
cachegirl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
