[package]
name = "candyriya-auth"
description = "Server-side Mojang session (hasJoined) verification and offline-mode authentication for the proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["minecraft", "proxy", "authentication", "mojang", "papermc"]
categories = ["authentication", "web-programming", "network-programming", "games"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
candyriya-player = { version = "0.1.0", path = "../../player/candyriya-player" }
reqwest = { workspace = true, default-features = false, features = ["default-tls"] }
thiserror = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true
