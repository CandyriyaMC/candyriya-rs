[package]
name = "candyriya-i18n"
description = "Locale loader for the proxy and its plugins: TOML + MiniMessage, fallback chains, hot reload."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["i18n", "localization", "minecraft", "proxy", "minimessage"]
categories = ["internationalization", "localization", "games"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
arc-swap = { workspace = true }
lobsterchat = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# no default features: nu-ansi-term (via `ansi`) pulls windows-sys, which needs
# dlltool that this build host does not have; tests don't need colored logs
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry", "std", "tracing-log"] }

[lints]
workspace = true
