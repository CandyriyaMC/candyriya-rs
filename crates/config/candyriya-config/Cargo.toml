[package]
name = "candyriya-config"
description = "Validated TOML configuration via figment with hot reload and first-run secret generation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["minecraft", "proxy", "config", "toml", "velocity"]
categories = ["config", "games"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
figment = { workspace = true }
toml = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
arc-swap = { workspace = true }
tracing = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
num_cpus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
