[package]
name = "candyriya-plugin-api"
description = "Shared candyriya plugin ABI contract types: proxy version, plugin metadata, events, chat/message-level building blocks (components, kick reasons, MiniMessage) and the visual packet field types (title, boss bar, player info / tab list) the proxy serializes onto the wire."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
lobsterchat = { workspace = true }
candyriya-i18n = { path = "../../common/candyriya-i18n" }
candyriya-protocol = { path = "../../protocol/candyriya-protocol" }
bytes = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
