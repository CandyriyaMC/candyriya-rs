[package]
name = "candyriya-plugin-api"
description = "Shared candyriya plugin ABI contract types: proxy version, plugin metadata, events, chat/message-level building blocks (components, kick reasons, MiniMessage) and the visual packet field types (title, boss bar, player info / tab list) the proxy serializes onto the wire."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["plugin", "api", "extism", "minecraft", "proxy"]
categories = ["wasm", "games", "game-development"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
semver = { workspace = true }
lobsterchat = { workspace = true }
# version is required for publishability; deny treats a bare path dep as a wildcard
candyriya-i18n = { version = "0.1.0", path = "../../common/candyriya-i18n" }
candyriya-protocol = { version = "0.1.0", path = "../../protocol/candyriya-protocol" }
bytes = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
toml = { workspace = true }

[lints]
workspace = true
