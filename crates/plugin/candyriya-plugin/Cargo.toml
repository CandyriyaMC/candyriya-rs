[package]
name = "candyriya-plugin"
description = "Extism WASM plugin host runtime: metadata, dependency resolution, lifecycle, hot reload and proxy-side services for plugins."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation.workspace = true
keywords = ["extism", "plugin", "wasm", "minecraft", "proxy"]
categories = ["wasm", "games", "game-development"]
readme = "../../../README.md"
exclude = [".github", "docs", "deny.toml", "*.md", "target", "fuzz", "tests/**"]

[dependencies]
extism = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
semver = { workspace = true }
tokio = { workspace = true }
indexmap = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
parking_lot = { workspace = true }
dashmap = { workspace = true }
notify = { workspace = true }
candyriya-plugin-api = { version = "0.1.0", path = "../candyriya-plugin-api" }
candyriya-cache = { version = "0.1.0", path = "../../common/candyriya-cache" }
candyriya-scheduler = { version = "0.1.0", path = "../../common/candyriya-scheduler" }
candyriya-config = { version = "0.1.0", path = "../../config/candyriya-config" }
candyriya-metrics = { version = "0.1.0", path = "../../common/candyriya-metrics" }
wasmparser = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
wat = "1"
tempfile = { workspace = true }

[lints]
workspace = true
