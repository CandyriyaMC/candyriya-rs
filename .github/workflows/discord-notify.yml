name: Discord notify

# Mirrors repo activity to the CandyriyaMC Discord `#github` channel.
# There is no native GitHub -> Discord webhook bridge: raw channel
# webhooks expect Discord-shaped payloads and 400 on GitHub's native JSON.
# So this workflow builds the Discord message itself and POSTs it.
#
# The webhook URL lives in the DISCORD_WEBHOOK_URL repository secret.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, closed]
  issues:
    types: [opened]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # native [skip ci] stops the whole workflow; [ci ignore] (handled in ci.yml)
    # silences the chat feed too. PRs and issues still announce.
    if: ${{ !contains(github.event.head_commit.message || '', '[ci ignore]') }}
    steps:
      - name: Post to Discord
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          COMPARE: ${{ github.event.compare }}
          HEADLINE: ${{ github.event.head_commit.message }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)
              content=$(printf '🔨 **Push to main** — %s\n%s\n%s' "$ACTOR" "$HEADLINE" "$COMPARE") ;;
            release)
              content=$(printf '🚀 **Release %s published** — %s\n%s' "$RELEASE_TAG" "$ACTOR" "$RELEASE_URL") ;;
            pull_request)
              if [ "$PR_MERGED" = "true" ]; then verb="merged"; else verb="closed"; fi
              content=$(printf '🔀 **PR #%s %s** — %s\nby %s · %s' "$PR_NUMBER" "$verb" "$PR_TITLE" "$ACTOR" "$PR_URL") ;;
            issues)
              content=$(printf '🐞 **Issue #%s opened** — %s\nby %s · %s' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ACTOR" "$ISSUE_URL") ;;
            workflow_dispatch)
              content=$(printf '🔧 discord-notify is live — triggered by %s' "$ACTOR") ;;
            *)
              echo "unhandled event: $EVENT" >&2
              exit 0 ;;
          esac
          jq -nc --arg content "$content" '{content: $content}' \
            | curl -fsS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK_URL"
