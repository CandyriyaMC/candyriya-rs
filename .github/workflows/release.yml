name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="candyriya-${VERSION}-${{ matrix.target }}.tar.gz"
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/candyriya" staging/candyriya
          tar -czf "dist/${ARCHIVE}" -C staging candyriya
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="candyriya-${VERSION}-${{ matrix.target }}.zip"
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/candyriya.exe" staging/candyriya.exe
          powershell.exe -NoProfile -Command "Compress-Archive -Path staging/candyriya.exe -DestinationPath \"dist/${ARCHIVE}\""
      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
