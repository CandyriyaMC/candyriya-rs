name: CI

on:
  push:
    branches: [main, dev, experiment/**]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same trick as GitHub's native [skip ci], done at job level on purpose:
  # a workflow that never starts leaves required checks "Pending" forever and
  # blocks the merge, while a job skipped by a condition reports success and
  # unblocks it. Put `[ci ignore]` in the commit message (push) or the PR
  # title (pull_request) to skip CI for docs/metadata-only changes.
  # Do not use it to sneak unreviewed changes past the gate.
  gate:
    name: ci gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          MSG="${COMMIT_MESSAGE}${PR_TITLE}"
          if echo "$MSG" | grep -qF '[ci ignore]'; then
            echo "[ci ignore] found — skipping CI jobs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  no-ad-hoc-spawn:
    name: no-ad-hoc-spawn
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for task/thread spawns outside the kernel
        shell: bash
        run: |
          set -euo pipefail
          # Paths where direct spawning is legal:
          #   crates/common/candyriya-scheduler/ — the kernel itself
          #   crates/common/candyriya-init/      — the supervision tree built on top of it
          #   crates/it/candyriya-it/            — loopback integration-test fixtures, spawn their own backend tasks
          #   crates/bench/                      — benches and fuzz targets
          #   crates/plugin/candyriya-plugin/src/instance.rs — dedicated OS thread per plugin
          #     (the plugin execution model; whether it moves into the tree is a design decision)
          #   */tests/**                         — integration tests
          allow_re='^crates/common/candyriya-scheduler/|^crates/common/candyriya-init/|^crates/it/candyriya-it/|^crates/bench/|^crates/plugin/candyriya-plugin/src/instance\.rs$|/tests/'

          # Call-shaped spawn patterns: a paren or turbofish right after the
          # path, so doc comments *about* spawning don't trip the gate.
          pattern='tokio::spawn[[:space:]]*(\(|::<)|tokio::task::spawn[[:space:]]*(\(|::<)|tokio::spawn_blocking[[:space:]]*(\(|::<)|task::spawn_blocking[[:space:]]*(\(|::<)|task::spawn[[:space:]]*(\(|::<)|std::thread::spawn[[:space:]]*(\(|::<)|thread::spawn[[:space:]]*(\(|::<)|std::thread::Builder|thread::Builder|rayon::spawn[[:space:]]*(\(|::<)|rayon::ThreadPool::spawn[[:space:]]*(\(|::<)|ThreadPool::spawn[[:space:]]*(\(|::<)|JoinSet'

          fail=0
          while IFS= read -r file; do
            # the first #[cfg(test)] boundary in the file, if any; hits at or
            # after it are test code and don't count
            test_start=$(grep -nE '^[[:space:]]*#\[cfg\((all\()?test' -- "$file" | cut -d: -f1 | head -n1 || true)
            while IFS= read -r hit; do
              line=${hit%%:*}
              if [ -n "$test_start" ] && [ "$line" -ge "$test_start" ]; then
                continue
              fi
              printf 'banned spawn outside the kernel: %s:%s\n' "$file" "$hit"
              fail=1
            done < <(grep -nE "$pattern" -- "$file" || true)
          done < <(git ls-files -z -- '*.rs' | grep -zvE "$allow_re" | tr '\0' '\n')

          if [ "$fail" -ne 0 ]; then
            echo "direct task/thread spawning is banned outside the kernel; route through candyriya-scheduler (TaskService)" >&2
            exit 1
          fi
          echo "no ad-hoc spawns outside the kernel"

  test:
    name: test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  # The native-abi contract and the greeting reference plugin must stay
  # buildable on every platform the release workflow targets; build the cdylib
  # here (.so on Linux, .dll on Windows, .dylib on macOS) and run the contract
  # tests. fmt/clippy/doc still run through the workspace jobs above.
  native-abi:
    name: native-abi ${{ matrix.os }}
    needs: gate
    if: needs.gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Contract tests
        run: cargo test -p candyriya-native-abi
      - name: Build the reference plugin cdylib
        run: cargo build --release -p greeting

  fuzz-check:
    name: fuzz targets (check)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Type-check fuzz targets
        run: cargo check --package candyriya-fuzz

  doc:
    name: rustdoc
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps --workspace

  security:
    name: security
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # EmbarkStudios/cargo-deny-action v2.1.2, pinned by commit SHA
      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: advisories
      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: licenses
      - name: cargo deny check bans
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: bans
      - name: cargo deny check sources
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: sources

  audit-check:
    name: audit-check
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # audit-check creates a check run; without this the annotations are lost.
    # (forked PRs fall back to stdout, as documented by the action)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # RustSec/audit-check v2.0.0, pinned by commit SHA
      - name: Scan Cargo.lock for vulnerabilities
        uses: RustSec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
