name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same trick as GitHub's native [skip ci], done at job level on purpose:
  # a workflow that never starts leaves required checks "Pending" forever and
  # blocks the merge, while a job skipped by a condition reports success and
  # unblocks it. Put `[ci ignore]` in the commit message (push) or the PR
  # title (pull_request) to skip CI for docs/metadata-only changes.
  # Do not use it to sneak unreviewed changes past the gate.
  gate:
    name: ci gate
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          MSG="${COMMIT_MESSAGE}${PR_TITLE}"
          if echo "$MSG" | grep -qF '[ci ignore]'; then
            echo "[ci ignore] found — skipping CI jobs"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  fmt:
    name: rustfmt
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace

  fuzz-check:
    name: fuzz targets (check)
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Type-check fuzz targets
        run: cargo check --package candyriya-fuzz

  doc:
    name: rustdoc
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        run: cargo doc --no-deps --workspace

  security:
    name: security
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # EmbarkStudios/cargo-deny-action v2.1.2, pinned by commit SHA
      - name: cargo deny check advisories
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: advisories
      - name: cargo deny check licenses
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: licenses
      - name: cargo deny check bans
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: bans
      - name: cargo deny check sources
        uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9
        with:
          command: check
          command-arguments: sources

  audit-check:
    name: audit-check
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # audit-check creates a check run; without this the annotations are lost.
    # (forked PRs fall back to stdout, as documented by the action)
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      # RustSec/audit-check v2.0.0, pinned by commit SHA
      - name: Scan Cargo.lock for vulnerabilities
        uses: RustSec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
